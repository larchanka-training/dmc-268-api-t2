name: Staging simulation audit

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize with deployment while inspecting the existing staging runtime.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ vars.VPS_DMC268_IP_T2 }}
      SSH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDDP5n14emZsPXXkzPjoTNy4RmHa8CEcvXLe/ILhuajd
      SSH_USER: ${{ secrets.VPS_DMC268_U }}
      SSHPASS: ${{ secrets.VPS_DMC268_P }}
    steps:
      - name: Checkout main workflow source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SSH_HOST}" || -z "${SSH_USER}" || -z "${SSHPASS}" ]]; then
            echo '::error::Existing VPS SSH configuration is unavailable'
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_HOST} ${SSH_HOST_KEY}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Audit Playground infrastructure without activation
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HMAC_SECRET_PRESENT: ${{ secrets.STAGING_SIMULATION_HMAC_SECRET_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${HMAC_SECRET_PRESENT}" == true || "${HMAC_SECRET_PRESENT}" == false ]] || exit 1
          compose_sha="$(sha256sum docker-compose.staging.yml | cut -d ' ' -f 1)"
          if ! timeout 120s sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "${SSH_USER}@${SSH_HOST}" \
            "python3 -B -I - '${EXPECTED_SHA}' '${HMAC_SECRET_PRESENT}' '${compose_sha}'" \
            < .github/scripts/staging_simulation_audit.py 2>/dev/null
          then
            echo '{"transport":"UNKNOWN","activation_authorized":false}'
            exit 1
          fi
