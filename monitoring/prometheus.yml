global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerts are intentionally not loaded/routed until an operator approves a destination.
rule_files: []
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:9100"]}]
  - job_name: analysis
    static_configs: [{targets: ["worker:9100"]}]
  - job_name: publication
    static_configs: [{targets: ["publication-worker:9100"]}]
  - job_name: webhook
    static_configs: [{targets: ["webhook-worker:9100"]}]
  - job_name: dispatcher
    static_configs: [{targets: ["outbox-dispatcher:9100"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
