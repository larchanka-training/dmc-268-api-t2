name: API CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      POSTGRES__HOST: localhost
      POSTGRES__PORT: "5432"
      POSTGRES__USER: dmc268_ci
      POSTGRES__PASSWORD: dmc268_ci
      POSTGRES__DB: dmc268_ci
      DMC268_TEST_DATABASE_URL: postgresql+asyncpg://dmc268_ci:dmc268_ci@localhost:5432/dmc268_ci
      # Settings are loaded at import (app.db.session); the LLM chain must be
      # valid, but CI never calls a provider.
      LLM__PRIMARY_PROVIDER: ollama
      LLM__FALLBACK_ENABLED: "false"
      LLM__OLLAMA__MODEL: ci-placeholder

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dmc268_ci
          POSTGRES_PASSWORD: dmc268_ci
          POSTGRES_DB: dmc268_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmc268_ci -d dmc268_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check database migrations
        run: uv run alembic check

      - name: Pytest
        run: uv run pytest

      - name: Downgrade database to base
        run: uv run alembic downgrade base

      - name: Reapply database migrations
        run: uv run alembic upgrade head

      - name: Check reapplied migrations
        run: uv run alembic check

      - name: PostgreSQL integration tests after migration roundtrip
        run: uv run pytest tests/test_postgres_integration.py

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t dmc-268-api-t2:${{ github.sha }} .

  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate dev compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q

      - name: Validate staging compose file
        run: docker compose --env-file .env.staging.example -f docker-compose.staging.yml config -q

  publish:
    name: Publish API image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality
      - docker
    # Images are published only from deployable branches: main (staging) and
    # develop (develop environment).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Build immutable API image
        run: docker build -t "${IMAGE_NAME}:sha-${GITHUB_SHA}" .

      - name: Push immutable API image
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
