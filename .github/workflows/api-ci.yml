name: API CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t dmc-268-api-t2:${{ github.sha }} .

  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate dev compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q

      - name: Validate staging compose file
        run: docker compose --env-file .env.staging.example -f docker-compose.staging.yml config -q

  publish:
    name: Publish API image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality
      - docker
    # Images are published only from deployable branches: main (staging) and
    # develop (develop environment).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Build immutable API image
        run: docker build -t "${IMAGE_NAME}:sha-${GITHUB_SHA}" .

      - name: Push immutable API image
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
