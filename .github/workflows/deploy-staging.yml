name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: staging
        options:
          - staging
          - develop
      ui_sha:
        description: Optional full UI commit SHA published to GHCR; omit to keep the currently deployed UI version
        required: false
        type: string
        default: ""
  workflow_run:
    workflows: ["API CI"]
    types:
      - completed
    # Event-level filter: PR-triggered "API CI" runs (head_branch is the PR
    # branch) create no Deploy run at all, instead of a skipped run queued on
    # the deploy concurrency group.
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: read
  actions: read # dispatch: read API CI runs to resolve the deployed commit

concurrency:
  group: deploy-${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || ((github.event.workflow_run.head_branch == 'develop' && 'develop') || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # workflow_dispatch must run from main (the workflow's canonical version);
    # workflow_run must be a successful push-triggered "API CI" run on main
    # (deploys staging) or develop (deploys the develop environment). The
    # workflow_run "branches" filter drops PR runs at the event level; the
    # event == 'push' check keeps dispatch-triggered "API CI" runs out (they
    # publish no image). github.ref is always the default branch for
    # workflow_run.
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'develop'
        )
      )

    env:
      SSH_HOST: ${{ vars.VPS_DMC268_IP_T2 }}
      SSH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDDP5n14emZsPXXkzPjoTNy4RmHa8CEcvXLe/ILhuajd
      UI_SHA: ${{ inputs.ui_sha }}
      # LLM gateway (docs/llm-gateway-review-pipeline.md §6a). Until Ollama is
      # deployed to staging, the chain is Eurorouter only.
      LLM_PRIMARY_PROVIDER: ${{ vars.STAGING_LLM_PRIMARY_PROVIDER || 'eurorouter' }}
      LLM_FALLBACK_ENABLED: ${{ vars.STAGING_LLM_FALLBACK_ENABLED || 'false' }}
      EUROROUTER_BASE_URL: ${{ vars.STAGING_EUROROUTER_BASE_URL }}
      EUROROUTER_MODEL: ${{ vars.STAGING_EUROROUTER_MODEL }}
      OLLAMA_BASE_URL: ${{ vars.STAGING_OLLAMA_BASE_URL || 'http://ollama:11434' }}
      OLLAMA_MODEL: ${{ vars.STAGING_OLLAMA_MODEL }}
      # ENV_NAME, DEPLOY_PATH, ENV_FILE, WEB_PORT, COMPOSE_PROJECT and
      # API_SHA are resolved per environment in the "Resolve deployment
      # target" step: only the initiating side's image changes, the other
      # side's deployed version is kept from the VPS state (ADR 0001).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve deployment target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            env_name="${{ inputs.environment }}"
          else
            case "${{ github.event.workflow_run.head_branch }}" in
              main) env_name='staging' ;;
              develop) env_name='develop' ;;
              *)
                echo "::error::Unexpected API CI branch: ${{ github.event.workflow_run.head_branch }}"
                exit 1
                ;;
            esac
          fi

          case "${env_name}" in
            staging)
              deploy_path='/opt/dmc-268-t2'
              env_file='.env.staging'
              web_port='80'
              ci_branch='main'
              compose_project='dmc-268-t2-staging'
              ;;
            develop)
              deploy_path='/opt/dmc-268-t2-develop'
              env_file='.env.staging.develop'
              web_port='8080'
              ci_branch='develop'
              compose_project='dmc-268-t2-develop'
              ;;
          esac

          # For workflow_run, github.sha is the default-branch HEAD, not the
          # commit "API CI" built; head_sha is the actual built commit. For
          # workflow_dispatch, take the latest successful push-triggered
          # "API CI" run on the target branch, so the image is guaranteed to
          # exist in GHCR.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            api_sha="${{ github.event.workflow_run.head_sha }}"
          else
            api_sha="$(gh api \
              "repos/${{ github.repository }}/actions/workflows/api-ci.yml/runs?event=push&status=success&branch=${ci_branch}&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty')"
            if [[ -z "${api_sha}" ]]; then
              echo "::error::No successful API CI run found for branch ${ci_branch}; push to ${ci_branch} first."
              exit 1
            fi
          fi

          {
            echo "ENV_NAME=${env_name}"
            echo "DEPLOY_PATH=${deploy_path}"
            echo "ENV_FILE=${env_file}"
            echo "WEB_PORT=${web_port}"
            echo "COMPOSE_PROJECT=${compose_project}"
            echo "API_SHA=${api_sha}"
          } >> "${GITHUB_ENV}"

          echo "Deploy target: ${env_name} (${deploy_path}, API CI branch: ${ci_branch})"
          echo "API commit: ${api_sha}"
          echo "Compose project: ${compose_project}"

      - name: Validate deployment configuration
        env:
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          SSH_PASSWORD: ${{ secrets.VPS_DMC268_P }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          EUROROUTER_API_KEYS: ${{ secrets.STAGING_EUROROUTER_API_KEYS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SSH_HOST:-}" ]]; then
            echo "::error::VPS_DMC268_IP_T2 is not available"
            exit 1
          fi

          if [[ -z "${SSH_USER:-}" ]]; then
            echo "::error::VPS_DMC268_U is not available"
            exit 1
          fi

          if [[ -z "${SSH_PASSWORD:-}" ]]; then
            echo "::error::VPS_DMC268_P is not available"
            exit 1
          fi

          if [[ -z "${POSTGRES_PASSWORD:-}" ]]; then
            echo "::error::STAGING_POSTGRES_PASSWORD is not available"
            exit 1
          fi

          # Provider chain from the flags (same rule as LLM.provider_chain).
          case "${LLM_PRIMARY_PROVIDER}" in
            eurorouter) secondary=ollama ;;
            ollama) secondary=eurorouter ;;
            *)
              echo "::error::STAGING_LLM_PRIMARY_PROVIDER must be eurorouter or ollama"
              exit 1
              ;;
          esac
          case "${LLM_FALLBACK_ENABLED}" in
            true) chain="${LLM_PRIMARY_PROVIDER} ${secondary}" ;;
            false) chain="${LLM_PRIMARY_PROVIDER}" ;;
            *)
              echo "::error::STAGING_LLM_FALLBACK_ENABLED must be true or false"
              exit 1
              ;;
          esac

          if [[ " ${chain} " == *" eurorouter "* ]]; then
            # The key value is never printed, only its presence is checked.
            if [[ -z "${EUROROUTER_API_KEYS:-}" ]]; then
              echo "::error::STAGING_EUROROUTER_API_KEYS is not available"
              exit 1
            fi
            if [[ -z "${EUROROUTER_BASE_URL:-}" ]]; then
              echo "::error::STAGING_EUROROUTER_BASE_URL is not available"
              exit 1
            fi
            if [[ "${EUROROUTER_BASE_URL}" != https://* ]]; then
              echo "::error::STAGING_EUROROUTER_BASE_URL must use https://"
              exit 1
            fi
            if [[ -z "${EUROROUTER_MODEL:-}" ]]; then
              echo "::error::STAGING_EUROROUTER_MODEL is not available"
              exit 1
            fi
          fi

          if [[ " ${chain} " == *" ollama "* && -z "${OLLAMA_MODEL:-}" ]]; then
            echo "::error::STAGING_OLLAMA_MODEL is not available"
            exit 1
          fi

          echo "LLM provider chain: ${chain}"

          if [[ ! "${API_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::API commit SHA must be a full 40-character Git SHA, got: ${API_SHA}"
            exit 1
          fi

          if [[ -n "${UI_SHA}" && ! "${UI_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::ui_sha must be a full 40-character Git commit SHA"
            exit 1
          fi

          echo "Required staging deployment configuration is available"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${SSH_HOST} ${SSH_HOST_KEY}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Verify Docker runtime
        env:
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          SSHPASS: ${{ secrets.VPS_DMC268_P }}
        shell: bash
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "${SSH_USER}@${SSH_HOST}" \
            'docker --version && docker compose version'

      - name: Resolve image versions
        env:
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          SSHPASS: ${{ secrets.VPS_DMC268_P }}
        shell: bash
        run: |
          set -euo pipefail

          readonly ui_image_base='ghcr.io/larchanka-training/dmc-268-ui-t2:sha-'
          readonly ui_image_re='^ghcr\.io/larchanka-training/dmc-268-ui-t2:sha-[0-9a-fA-F]{40}$'
          readonly api_image_re='^ghcr\.io/larchanka-training/dmc-268-api-t2:sha-[0-9a-fA-F]{40}$'

          read_remote_env() {
            local key="$1"
            sshpass -e ssh \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              "${SSH_USER}@${SSH_HOST}" \
              "grep -E '^${key}=' '${DEPLOY_PATH}/${ENV_FILE}' 2>/dev/null | tail -n1 | cut -d= -f2-" || true
          }

          # Only the image of the initiating side changes; the other side's
          # deployed version is kept from the env file on the VPS (ADR 0001).
          if [[ -n "${UI_SHA}" ]]; then
            ui_image="${ui_image_base}${UI_SHA}"
            api_image="$(read_remote_env API_IMAGE)"
            # Bootstrap: a fresh VPS has no env file yet. The manual first
            # deploy (run from main after API CI) pins this workflow's commit.
            if [[ -z "${api_image}" ]]; then
              api_image="ghcr.io/${{ github.repository }}:sha-${API_SHA}"
              echo "No deployed API_IMAGE found; using this workflow's commit: ${api_image}"
            fi
          else
            api_image="ghcr.io/${{ github.repository }}:sha-${API_SHA}"
            ui_image="$(read_remote_env UI_IMAGE)"
          fi

          if [[ -z "${ui_image}" ]]; then
            echo "::error::ui_sha was not provided and ${DEPLOY_PATH}/${ENV_FILE} on the VPS has no UI_IMAGE."
            echo "::error::Run this workflow once manually with ui_sha to pin the frontend version; automatic deployments will keep it afterwards."
            exit 1
          fi

          if [[ ! "${ui_image}" =~ ${ui_image_re} ]]; then
            echo "::error::UI_IMAGE has an unexpected format: ${ui_image}"
            exit 1
          fi

          if [[ ! "${api_image}" =~ ${api_image_re} ]]; then
            echo "::error::API_IMAGE has an unexpected format: ${api_image}"
            exit 1
          fi

          {
            echo "API_IMAGE=${api_image}"
            echo "UI_IMAGE=${ui_image}"
          } >> "${GITHUB_ENV}"

          echo "Deploying API image: ${api_image}"
          echo "Deploying UI image: ${ui_image}"

      - name: Prepare deployment directory
        env:
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          SSHPASS: ${{ secrets.VPS_DMC268_P }}
        shell: bash
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "${SSH_USER}@${SSH_HOST}" \
            "install -d -m 0755 '${DEPLOY_PATH}'"

          sshpass -e scp \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            docker-compose.staging.yml \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/docker-compose.staging.yml"

      - name: Write runtime environment
        env:
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          SSHPASS: ${{ secrets.VPS_DMC268_P }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          EUROROUTER_API_KEYS: ${{ secrets.STAGING_EUROROUTER_API_KEYS }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK__SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          append_optional() {
            local name="$1" value="$2"
            if [[ -n "${value}" ]]; then
              printf '%s=%s\n' "${name}" "${value}"
            fi
          }

          {
            printf 'API_IMAGE=%s\n' "${API_IMAGE}"
            printf 'UI_IMAGE=%s\n' "${UI_IMAGE}"
            printf 'WEB_PORT=%s\n' "${WEB_PORT}"
            printf 'POSTGRES__USER=dmc\n'
            printf 'POSTGRES__PASSWORD=%s\n' "${POSTGRES_PASSWORD}"
            printf 'POSTGRES__DB=dmc\n'
            printf 'LLM__PRIMARY_PROVIDER=%s\n' "${LLM_PRIMARY_PROVIDER}"
            printf 'LLM__FALLBACK_ENABLED=%s\n' "${LLM_FALLBACK_ENABLED}"
            printf 'LLM__EUROROUTER__BASE_URL=%s\n' "${EUROROUTER_BASE_URL}"
            printf 'LLM__EUROROUTER__MODEL=%s\n' "${EUROROUTER_MODEL}"
            printf 'LLM__EUROROUTER__API_KEYS=%s\n' "${EUROROUTER_API_KEYS}"
            printf 'LLM__OLLAMA__BASE_URL=%s\n' "${OLLAMA_BASE_URL}"
            printf 'LLM__OLLAMA__MODEL=%s\n' "${OLLAMA_MODEL}"
            # Runtime secrets passthrough: GitHub Encrypted Secrets ->
            # container env. Forwarded only when the secret is defined;
            # naming convention in docs/staging-deployment.md.
            append_optional 'WEBHOOK__SECRET' "${WEBHOOK_SECRET:-}"
          } | sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "${SSH_USER}@${SSH_HOST}" \
            "umask 077 && cat > '${DEPLOY_PATH}/${ENV_FILE}'"

      - name: Deploy application
        env:
          SSH_USER: ${{ secrets.VPS_DMC268_U }}
          SSHPASS: ${{ secrets.VPS_DMC268_P }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          cleanup_registry() {
            sshpass -e ssh \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              "${SSH_USER}@${SSH_HOST}" \
              'docker logout ghcr.io >/dev/null 2>&1 || true' \
              >/dev/null 2>&1 || true
          }
          trap cleanup_registry EXIT

          printf '%s' "${GHCR_TOKEN}" | sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "${SSH_USER}@${SSH_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' ENV_FILE='${ENV_FILE}' WEB_PORT='${WEB_PORT}' ENV_NAME='${ENV_NAME}' COMPOSE_PROJECT='${COMPOSE_PROJECT}' bash -s" \
            <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          # -p pins the Compose project name per environment (staging vs
          # develop). Without it both deployments would fall back to the
          # "name:" from docker-compose.staging.yml and share containers,
          # network and db-data volume — a develop deploy would touch
          # staging resources.
          compose() {
            docker compose \
              -p "${COMPOSE_PROJECT}" \
              --env-file "${ENV_FILE}" \
              -f docker-compose.staging.yml \
              "$@"
          }

          compose pull

          compose up -d db redis

          echo "Waiting for PostgreSQL and Redis..."
          for attempt in $(seq 1 30); do
            db_id="$(compose ps -q db)"
            redis_id="$(compose ps -q redis)"

            db_status="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "${db_id}" 2>/dev/null || true)"

            redis_status="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "${redis_id}" 2>/dev/null || true)"

            if [[ "${db_status}" == "healthy" && "${redis_status}" == "healthy" ]]; then
              break
            fi

            if [[ "${attempt}" -eq 30 ]]; then
              echo "ERROR: PostgreSQL or Redis did not become healthy"
              compose ps
              exit 1
            fi

            sleep 2
          done

          echo "Running database migrations..."
          compose run --rm --no-deps --interactive=false -T api alembic upgrade head </dev/null

          echo "Starting API..."
          compose up -d api

          echo "Waiting for API healthcheck..."
          for attempt in $(seq 1 30); do
            api_id="$(compose ps -q api)"

            api_status="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "${api_id}" 2>/dev/null || true)"

            if [[ "${api_status}" == "healthy" ]]; then
              echo "API is healthy"
              break
            fi

            if [[ "${api_status}" == "unhealthy" ]]; then
              echo "ERROR: API became unhealthy"
              compose ps
              compose logs --tail=100 api
              exit 1
            fi

            if [[ "${attempt}" -eq 30 ]]; then
              echo "ERROR: API did not become healthy"
              compose ps
              compose logs --tail=100 api
              exit 1
            fi

            sleep 2
          done

          echo "Starting worker..."
          compose up -d worker

          echo "Waiting for worker..."
          for attempt in $(seq 1 30); do
            worker_id="$(compose ps -q worker)"

            worker_state="$(docker inspect \
              --format='{{.State.Status}}' \
              "${worker_id}" 2>/dev/null || true)"

            if [[ "${worker_state}" == "running" ]]; then
              echo "Worker is running"
              break
            fi

            if [[ "${attempt}" -eq 30 ]]; then
              echo "ERROR: Worker did not reach running state"
              compose ps
              compose logs --tail=100 worker
              exit 1
            fi

            sleep 2
          done

          echo "Starting web..."
          compose up -d web

          echo "Waiting for web..."
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${WEB_PORT}/" >/dev/null; then
              echo "${ENV_NAME} web is healthy"
              compose ps
              exit 0
            fi

            if [[ "${attempt}" -eq 30 ]]; then
              echo "ERROR: Web healthcheck failed"
              compose ps
              compose logs --tail=100 web
              exit 1
            fi

            sleep 2
          done
          REMOTE
