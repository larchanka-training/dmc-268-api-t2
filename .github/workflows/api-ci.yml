name: API CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      POSTGRES__HOST: localhost
      POSTGRES__PORT: "5432"
      POSTGRES__USER: dmc268_ci
      POSTGRES__PASSWORD: dmc268_ci
      POSTGRES__DB: dmc268_ci
      DMC268_TEST_DATABASE_URL: postgresql+asyncpg://dmc268_ci:dmc268_ci@localhost:5432/dmc268_ci
      DMC268_RUN_DOCKER_TESTS: "1"
      DMC268_TEST_REDIS_URL: redis://localhost:6379/0
      DMC268_LOAD_REPORT: eval-webhook-load.jsonl

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dmc268_ci
          POSTGRES_PASSWORD: dmc268_ci
          POSTGRES_DB: dmc268_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmc268_ci -d dmc268_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check database migrations
        run: uv run alembic check

      - name: Pytest
        env:
          DMC268_RULES_E2E_RECORDS_DIR: ${{ runner.temp }}/rules-e2e-${{ github.run_id }}-${{ github.run_attempt }}/records
        run: uv run pytest -m "not chaos"

      - name: Generate rules state E2E report
        id: rules_e2e_report
        run: >-
          uv run python -m scripts.rules_e2e_report
          --records-dir "${{ runner.temp }}/rules-e2e-${{ github.run_id }}-${{ github.run_attempt }}/records"
          --output-dir "${{ runner.temp }}/rules-e2e-${{ github.run_id }}-${{ github.run_attempt }}/report"

      - name: Upload rules state E2E report
        if: steps.rules_e2e_report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rules-e2e-report
          path: |
            ${{ runner.temp }}/rules-e2e-${{ github.run_id }}-${{ github.run_attempt }}/report/rules-e2e-states.json
            ${{ runner.temp }}/rules-e2e-${{ github.run_id }}-${{ github.run_attempt }}/report/rules-e2e-states.md
          retention-days: 14
          if-no-files-found: error

      - name: Rule-specific paired benchmark (scripted Worker, no model quality)
        run: >-
          uv run python -m scripts.eval_harness.rules_runner
          --mode deterministic --disposable
          --output-dir "${{ runner.temp }}/rules-quality"

      - name: Upload rule-specific quality report
        uses: actions/upload-artifact@v4
        with:
          name: rules-quality-report
          path: |
            ${{ runner.temp }}/rules-quality/rules-quality-report.json
            ${{ runner.temp }}/rules-quality/rules-quality-report.md
          retention-days: 14
          if-no-files-found: error

      - name: Gold benchmark replay
        run: >-
          uv run python -m scripts.eval_harness --mode offline
          --dataset-dir test-prs-dataset --report-out eval-offline.json

      - name: Gold benchmark verified Gateway regression
        run: >-
          uv run python -m scripts.eval_harness --mode deterministic
          --dataset-dir test-prs-dataset --report-out eval-deterministic.json

      - name: Scripted controlled worker benchmark (not model quality)
        run: >-
          uv run python -m scripts.eval_harness --scope worker --mode deterministic
          --dataset-dir test-prs-dataset --report-out eval-worker-scripted.json

      - name: Upload gold benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-benchmark-reports
          path: |
            eval-offline.json
            eval-deterministic.json
            eval-worker-scripted.json
            eval-webhook-load.jsonl
          retention-days: 14
          if-no-files-found: warn

      - name: Downgrade database to base
        run: uv run alembic downgrade base

      - name: Reapply database migrations
        run: uv run alembic upgrade head

      - name: Check reapplied migrations
        run: uv run alembic check

      - name: PostgreSQL integration tests after migration roundtrip
        run: uv run pytest tests/test_postgres_integration.py

  chaos:
    name: Chaos and fault tolerance
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      POSTGRES__HOST: localhost
      POSTGRES__PORT: "5432"
      POSTGRES__USER: dmc268_ci
      POSTGRES__PASSWORD: dmc268_ci
      POSTGRES__DB: dmc268_ci
      DMC268_TEST_DATABASE_URL: postgresql+asyncpg://dmc268_ci:dmc268_ci@localhost:5432/dmc268_ci
      DMC268_TEST_REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dmc268_ci
          POSTGRES_PASSWORD: dmc268_ci
          POSTGRES_DB: dmc268_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmc268_ci -d dmc268_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Chaos suite
        run: uv run pytest -m chaos -ra


  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build --build-arg GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }} -t dmc-268-api-t2:${{ github.sha }} .

  caddy:
    name: Caddyfile
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate dev compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q

      - name: Validate staging compose file
        run: docker compose --env-file .env.staging.example -f docker-compose.staging.yml config -q

  publish:
    name: Publish API image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality
      - docker
    # Images are published only from deployable branches: main (staging) and
    # develop (develop environment).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Build immutable API image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "${IMAGE_NAME}:sha-${GITHUB_SHA}" .

      - name: Push immutable API image
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
